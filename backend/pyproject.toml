[project]
name = "preparador-audiencia-backend"
version = "0.1.0"
description = "Backend do Preparador de Audiencia, iniciando pela extracao de PDF por pagina."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
extrair-pdf-processo = "preparador_audiencia.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
