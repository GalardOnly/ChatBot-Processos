[project]
name = "preparador-audiencia-backend"
version = "0.1.0"
description = "Backend do Preparador de Audiencia, iniciando pela extracao de PDF por pagina."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "fastapi",
    "httpx",
    "python-multipart",
    "python-dotenv",
    "pillow",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.4",
    "streamlit",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
bertikal = [
    "torch",
    "transformers>=4.43",
]
models = [
    "sentence-transformers>=3.0",
    "torch",
    "transformers>=4.43",
]
ocr-easy = [
    "easyocr>=1.7.2",
]

[project.scripts]
extrair-pdf-processo = "preparador_audiencia.cli:main"
avaliar-poc-modelos = "preparador_audiencia.eval_cli:main"
benchmark-fontes = "preparador_audiencia.benchmark_cli:main"
benchmark-respostas = "preparador_audiencia.response_benchmark_cli:main"
perguntas-audiencia = "preparador_audiencia.question_bank_cli:main"
perguntas-candidatas = "preparador_audiencia.question_sources_cli:main"
perguntas-promocao = "preparador_audiencia.question_promotion_cli:main"
benchmark-roteamento = "preparador_audiencia.routing_benchmark_cli:main"
suite-referencia = "preparador_audiencia.reference_suite_cli:main"
benchmark-nulidades = "preparador_audiencia.nullity_benchmark_cli:main"
validar-dossie = "preparador_audiencia.dossier_validation_cli:main"
benchmark-ocr = "preparador_audiencia.ocr_benchmark_cli:main"
benchmark-integrado = "preparador_audiencia.integrated_benchmark_cli:main"
adaptar-benchmark-publico = "preparador_audiencia.integrated_reference_cli:main"
benchmark-chat-publico = "preparador_audiencia.integrated_chat_cli:main"
perfil-latencia-chat = "preparador_audiencia.chat_latency_cli:main"
amostra-validacao = "preparador_audiencia.legal_validation_sample_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
