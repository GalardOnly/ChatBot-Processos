[project]
name = "preparador-audiencia-backend"
version = "0.1.0"
description = "Backend do Preparador de Audiencia, iniciando pela extracao de PDF por pagina."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=0.5",
    "fastapi",
    "httpx",
    "python-multipart",
    "python-dotenv",
    "pillow",
    "pymupdf>=1.24",
    "rapidocr-onnxruntime>=1.4",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "httpx",
    "pytest",
    "ruff",
]
bertikal = [
    "torch",
    "transformers>=4.43",
]
models = [
    "sentence-transformers>=3.0",
    "torch",
    "transformers>=4.43",
]

[project.scripts]
extrair-pdf-processo = "preparador_audiencia.cli:main"
avaliar-poc-modelos = "preparador_audiencia.eval_cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
